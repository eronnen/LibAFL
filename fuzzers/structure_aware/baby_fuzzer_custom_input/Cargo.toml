[package]
name = "baby_fuzzer_custom_input"
version = "0.1.0"
authors = ["Valentin Huber <contact@valentinhuber.me>"]
edition = "2021"

[features]
default = ["simple_interface"]
simple_interface = []

# [profile.dev]
# panic = "abort"

# [profile.release]
# panic = "abort"
# lto = true
# codegen-units = 1
# opt-level = 3
# debug = true

[dependencies]
libafl = { workspace = true, default-features = true }
libafl_bolts = { workspace = true, default-features = true }
libafl_mutators_derive = { workspace = true }
log = { version = "0.4.22", features = ["release_max_level_info"] }
serde = "1.0.210"
